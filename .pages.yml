  # ---------------------------------------------------------------- BLOG
  - name: blog
    label: Blog articles
    type: collection
    path: content/blog
    format: json
    filename: "blog-{primary}.json"
    view:
      fields: [title, category, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
    fields:
      - { name: title, label: Article name (English), type: string, required: true }
      - { name: draft, label: Hide this article (draft), type: boolean, default: false }
      - name: category
        label: Category
        type: select
        default: desert
        options:
          values:
            - { name: desert, label: Desert }
            - { name: tips, label: Travel tips }
            - { name: daytrips, label: Day trips }
            - { name: culture, label: Culture }
      - { name: order, label: Position (small number = first), type: number, default: 50 }
      - { name: featured, label: Big featured article on the blog page, type: boolean, default: false }
      - { name: image, label: Photo, type: image, required: true }
      - { name: minutes, label: Minutes to read, type: number, default: 5 }
      - { name: headline, label: Title, component: text3 }
      - { name: excerpt, label: Short description, component: para3 }
      - { name: intro, label: Introduction, component: para3 }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Section {index}"
        fields:
          - { name: heading, label: Heading, component: text3 }
          - { name: text, label: "Text (leave an empty line between paragraphs)", component: para3 }
      - name: facts
        label: Quick facts (box on the side)
        type: object
        list: { max: 6 }
        fields:
          - { name: label, label: Label, component: text3 }
          - { name: value, label: Value, component: text3 }
      - name: related
        label: Related tours (links)
        type: object
        list: { max: 4 }
        fields:
          - { name: page, label: "Page (e.g. tour-3day-merzouga.html)", type: string }
          - { name: label, label: Link text, component: text3 }
