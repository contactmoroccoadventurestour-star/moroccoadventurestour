# Pages CMS — https://app.pagescms.org
# Two things can be edited here: the site photos and the blog.
# Every save is a commit on "main"; the GitHub Action "Build site" then updates the pages
# (about 1–3 minutes). Tours are not edited here: they stay on the site as they are.

media:
  input: images
  output: /images
  categories: [image]

components:
  text3:
    type: object
    fields:
      - { name: en, label: English, type: string }
      - { name: es, label: Español, type: string }
      - { name: it, label: Italiano, type: string }
  para3:
    type: object
    fields:
      - { name: en, label: English, type: text }
      - { name: es, label: Español, type: text }
      - { name: it, label: Italiano, type: text }

